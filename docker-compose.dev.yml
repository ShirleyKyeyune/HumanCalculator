services:
  human-calculator-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: human-calculator-dev
    container_name: human-calculator-dev
    ports:
      - "7842:7842"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - PORT=7842
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=7842
    stdin_open: true
    tty: true
